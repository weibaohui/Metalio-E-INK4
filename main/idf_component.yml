## IDF Component Manager Manifest File
dependencies:
  espressif/esp_io_expander_tca9554: ==2.0.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  espressif/esp_lcd_panel_io_additions: ^1.0.1
  78/esp-opus-encoder: ~2.4.1
  78/xiaozhi-fonts: ~1.5.5
  78/uart-uhci: ~0.2.1
  espressif/iot_eth: ^0.1.0
  espressif/led_strip: ~3.0.1
  espressif/esp_codec_dev: ~1.5
  # 收音机应用：MP3 流解码（esp_audio_simple_dec）
  espressif/esp_audio_codec: ^2.6.0
  espressif/esp-sr: ~2.2.0
  espressif/button: ~4.1.3
  espressif/knob: ^1.0.0
  espressif/esp_video:
    version: ==1.3.1
    rules:
    - if: target not in [esp32]
  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target not in [esp32]
  # CST816S 盖板电容触摸驱动
  espressif/esp_lcd_touch_cst816s: ^1.0.6
  lvgl/lvgl: ==9.5.0
  # esp_lvgl_port：已 vendored 到 components/esp_lvgl_port（保留 COLOR_DEPTH_1 兼容补丁）
  espressif/esp_lvgl_adapter: ==0.6.3
  espressif/esp_mmap_assets: '>=1.2'
  espressif/esp_new_jpeg: ^0.6.1
  espressif/zlib: "*"
  # TTF/OTF → .ef 设备端字体转换（已被 esp_lvgl_adapter 传递依赖，此处显式声明）
  espressif/freetype: 2.14.3~1

  # 动态应用试点：运行时加载 SD 卡上的 .so（官方 ELF Loader，S3 支持 PSRAM 运行）
  espressif/elf_loader: ==1.3.5

  # 设置页模拟 U 盘（TinyUSB MSC）；S3 内置 USB 与 USJ 互斥切换
  espressif/esp_tinyusb:
    version: ^2.0.0
    rules:
    - if: target in [esp32s3]

  # USB UVC 单帧静拍（自动测试摄像头）；与 TinyUSB MSC 运行期互斥
  espressif/usb_host_uvc:
    version: "^2.3.0"
    rules:
    - if: target in [esp32s3]

  ## Required IDF version
  idf:
    version: '>=5.4.0'
